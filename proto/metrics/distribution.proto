// Adapted from google.api.Distribution (google/api/distribution.proto).
// Exemplar.attachments simplified: google.protobuf.Any replaced with a string
// label to avoid the heavyweight Any import. Typed attachments (e.g. trace IDs)
// can be added later via a typed oneof when needed.
syntax = "proto3";

package metrics;

option go_package = "github.com/accretional/grpc-server-config/pb/metrics";

import "google/protobuf/timestamp.proto";

// Distribution contains summary statistics for a population of values and an
// optional histogram over a set of buckets.
//
// The underflow bucket (index 0) and overflow bucket (index N-1) are always
// present; the N-2 finite buckets sit between them. bucket_counts must have
// exactly as many entries as there are buckets implied by bucket_options.
message Distribution {
  // Range records the observed minimum and maximum of the population.
  // Must not be present when count is zero.
  message Range {
    double min = 1;
    double max = 2;
  }

  // BucketOptions defines the histogram bucket boundaries.
  // Exactly one variant must be set. The N+2 buckets (N finite + underflow +
  // overflow) are contiguous and cover (-∞, +∞).
  message BucketOptions {
    // Linear: N+2 equal-width buckets.
    //   Bucket 0 (underflow): (-∞, offset)
    //   Bucket i (1..N):      [offset+(i-1)*width, offset+i*width)
    //   Bucket N+1 (overflow):[offset+N*width, +∞)
    message Linear {
      int32 num_finite_buckets = 1;  // N, must be > 0
      double width = 2;              // must be > 0
      double offset = 3;             // lower bound of first finite bucket
    }

    // Exponential: N+2 geometrically-growing buckets.
    //   Bucket 0 (underflow): (-∞, scale)
    //   Bucket i (1..N):      [scale*g^(i-1), scale*g^i)
    //   Bucket N+1 (overflow):[scale*g^N, +∞)
    message Exponential {
      int32 num_finite_buckets = 1;  // N, must be > 0
      double growth_factor = 2;      // g, must be > 1
      double scale = 3;              // must be > 0
    }

    // Explicit: buckets defined by a sorted list of boundary values.
    //   Produces len(bounds)+1 buckets.
    //   Bucket 0 (underflow): (-∞, bounds[0])
    //   Bucket i (1..k-1):    [bounds[i-1], bounds[i])
    //   Bucket k (overflow):  [bounds[k-1], +∞)
    message Explicit {
      repeated double bounds = 1;  // must be monotonically increasing
    }

    oneof options {
      Linear linear_buckets = 1;
      Exponential exponential_buckets = 2;
      Explicit explicit_buckets = 3;
    }
  }

  // Exemplar annotates a single sampled value within the distribution.
  // Carries the value, observation time, and an optional human-readable label.
  // Exemplars must be in increasing order of value.
  message Exemplar {
    // The sampled value; determines which bucket this exemplar belongs to.
    double value = 1;
    // When the sample was observed.
    google.protobuf.Timestamp timestamp = 2;
    // Optional human-readable context (e.g. a trace ID or request path).
    // A typed attachment oneof can replace this when richer metadata is needed.
    string label = 3;
  }

  // Total number of values. Must equal sum(bucket_counts) when a histogram
  // is present.
  int64 count = 1;

  // Arithmetic mean of the values. Must be zero when count is zero.
  double mean = 2;

  // Sum of squared deviations from the mean: Σ(x_i - mean)².
  // Computed via Welford's online algorithm. Must be zero when count is zero.
  double sum_of_squared_deviation = 3;

  // Observed min/max. Must not be set when count is zero.
  Range range = 4;

  // Histogram bucket boundaries. Omit when no histogram is needed.
  BucketOptions bucket_options = 6;

  // Count per bucket, in bucket order (underflow first, overflow last).
  // Must have exactly as many entries as buckets defined by bucket_options.
  // Trailing zeros may be omitted.
  repeated int64 bucket_counts = 7;

  // Sampled exemplar points. Must be in increasing order of value.
  repeated Exemplar exemplars = 10;
}
