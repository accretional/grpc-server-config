syntax = "proto3";

package metrics;

option go_package = "github.com/accretional/grpc-server-config/pb/metrics";

import "metrics/aggregation_service.proto";

// WriteTimeSeriesRequest carries a batch of time series pushed by an agent.
message WriteTimeSeriesRequest {
  repeated AnyTimeSeries series = 1;
}

message WriteTimeSeriesResponse {
  // Total number of individual data points accepted across all streamed batches.
  int32 points_written = 1;
}

// MetricService is the ingest endpoint for agents running on monitored hosts.
// Agents open a client-streaming RPC, send one or more batches of time series,
// then close the stream to receive the final written-point count.
service MetricService {
  rpc WriteTimeSeries(stream WriteTimeSeriesRequest) returns (WriteTimeSeriesResponse);
}
